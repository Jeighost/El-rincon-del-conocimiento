<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Jeighost Admin Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ESTILOS BASE (Mismos que tenías + mejoras) */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--gold:#d4af37;--gold-light:#ffd700;--black:#0b0b0c;--gray:#151515;--gray-light:#222;--text:#f5e6d3;--success:#22c55e;--danger:#ef4444}
    body{font-family:'Crimson Pro',serif;background:var(--black);color:var(--text);min-height:100vh;overflow-x:hidden}
    
    /* UI ELEMENTS */
    .halo{position:fixed;top:50%;left:50%;width:320px;height:320px;background:radial-gradient(circle,rgba(212,175,55,0.18),transparent 70%);border-radius:50%;pointer-events:none;z-index:-1;animation:pulse 6s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.35}50%{transform:translate(-50%,-50%) scale(1.6);opacity:.1}}
    
    input,textarea,select{width:100%;padding:12px 13px;border-radius:10px;background:rgba(212,175,55,.08);border:2px solid var(--gold);color:var(--text);font-size:1rem;font-family:inherit;outline:none;margin-bottom:10px}
    input:focus,textarea:focus{border-color:var(--gold-light);background:rgba(212,175,55,.12)}
    textarea{min-height:200px;resize:vertical}
    label{display:block;margin:10px 0 5px;color:var(--gold);font-weight:600}
    
    .btn{padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--black);border:none;font-weight:700;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(212,175,55,.4)}
    .btn-ghost{background:transparent;border:2px solid var(--gold);color:var(--gold)}
    .btn-danger{background:var(--danger);color:white;background:linear-gradient(135deg,#dc2626,#ef4444)}
    .btn-full{width:100%;justify-content:center}
    
    .card{background:var(--gray);border:2px solid var(--gold);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    .hidden{display:none!important}
    
    /* LAYOUT */
    .dash-layout{display:flex;min-height:100vh}
    .sidebar{width:260px;background:var(--gray);border-right:2px solid var(--gold);padding:20px;position:fixed;height:100vh;overflow-y:auto;z-index:10}
    .main-content{flex:1;margin-left:260px;padding:20px}
    .sidebar-nav a{display:block;padding:12px;color:var(--text);text-decoration:none;border-radius:8px;margin-bottom:5px;transition:0.3s}
    .sidebar-nav a:hover, .sidebar-nav a.active{background:rgba(212,175,55,0.2);color:var(--gold)}
    
    /* PREVIEW */
    .preview-box{background:#fff;color:#000;padding:20px;border-radius:8px;max-height:400px;overflow:auto}
    
    /* LOG CONSOLE */
    #console-log{background:#000;color:#0f0;font-family:monospace;padding:15px;border-radius:8px;border:1px solid #333;margin-top:20px;max-height:200px;overflow-y:auto;font-size:0.9rem}
    .log-line{margin-bottom:5px;border-bottom:1px solid #222}
    
    /* MOBILE */
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);transition:0.3s}
      .sidebar.open{transform:translateX(0)}
      .main-content{margin-left:0}
      .mobile-menu{position:fixed;bottom:20px;right:20px;z-index:100;width:50px;height:50px;border-radius:50%;background:var(--gold);border:none;font-size:1.5rem}
    }
  </style>
</head>
<body>
<div class="halo"></div>

<!-- LOGIN -->
<section id="login-screen" style="display:flex;align-items:center;justify-content:center;height:100vh">
  <div class="card" style="width:100%;max-width:400px;text-align:center">
    <h2 style="color:var(--gold);margin-bottom:20px">🔐 Jeighost Admin</h2>
    <form id="login-form">
      <input type="email" id="username" placeholder="Email" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-full">Entrar</button>
    </form>
    <p id="login-error" style="color:red;margin-top:10px" class="hidden"></p>
  </div>
</section>

<!-- DASHBOARD -->
<main id="dashboard" class="hidden">
  <button class="mobile-menu" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  
  <div class="dash-layout">
    <aside class="sidebar" id="sidebar">
      <h2 style="color:var(--gold);margin-bottom:20px;text-align:center">JeigHost Studio</h2>
      <nav class="sidebar-nav">
        <a href="#" onclick="showSection('editor')" class="active"><i class="fas fa-pen"></i> Editor</a>
        <a href="#" onclick="showSection('config')"><i class="fas fa-cog"></i> Configuración GitHub</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</a>
      </nav>
      <div style="margin-top:30px;font-size:0.8rem;opacity:0.6;text-align:center">
        v2.0 - AutoPublish
      </div>
    </aside>

    <div class="main-content">
      
      <!-- EDITOR SECTION -->
      <section id="editor-section">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h2 style="color:var(--gold)">✍️ Nueva Reflexión</h2>
            <div style="display:flex;gap:10px">
               <button class="btn btn-ghost btn-small" onclick="clearForm()">Limpiar</button>
               <button class="btn btn-small" onclick="saveDraft()">Guardar Borrador</button>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
            <div>
              <label>Título</label>
              <input id="title" type="text" placeholder="Ej: El eco del silencio" oninput="generateSlug()">
            </div>
            <div>
              <label>Slug (URL de la carpeta)</label>
              <input id="slug" type="text" placeholder="el-eco-del-silencio" readonly style="opacity:0.7">
            </div>
          </div>

          <label>Preview (Frase corta)</label>
          <input id="preview" type="text" placeholder="Una línea que atrapa...">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
            <div>
              <label>Tags</label>
              <input id="tags" type="text" placeholder="filosofía, vida">
            </div>
            <div>
              <label>Categorías</label>
              <input id="categories" type="text" placeholder="Pensamiento">
            </div>
          </div>

          <label>Contenido (HTML permitido, saltos de línea = párrafos)</label>
          <textarea id="content" placeholder="Escribe aquí tu reflexión..."></textarea>
          
          <div class="word-count" id="word-count" style="text-align:right;color:var(--gold);font-size:0.8rem">0 palabras</div>

          <div style="margin-top:20px;display:flex;gap:15px;flex-wrap:wrap">
            <button class="btn" onclick="publishToGitHub()">
              <i class="fas fa-rocket"></i> PUBLICAR EN GITHUB
            </button>
            <button class="btn btn-ghost" onclick="togglePreview()">Ver Preview</button>
          </div>

          <!-- CONSOLA DE PROCESOS -->
          <div id="console-log" class="hidden"></div>
        </div>

        <!-- PREVIEW HIDDEN -->
        <div id="preview-panel" class="card hidden">
          <h3>Vista Previa:</h3>
          <div id="preview-content" style="line-height:1.6;margin-top:10px"></div>
        </div>
      </section>

      <!-- CONFIG SECTION -->
      <section id="config-section" class="hidden">
        <div class="card">
          <h2 style="color:var(--gold)"><i class="fas fa-github"></i> Conexión GitHub</h2>
          <p style="opacity:0.8;margin-bottom:20px">Configura esto una vez para poder publicar automáticamente.</p>
          
          <label>Usuario de GitHub</label>
          <input id="gh-owner" type="text" placeholder="Ej: tuusuario">
          
          <label>Nombre del Repositorio</label>
          <input id="gh-repo" type="text" placeholder="Ej: jeighost-web">
          
          <label>Personal Access Token (Classic)</label>
          <input id="gh-token" type="password" placeholder="ghp_xxxxxxxxxxxx">
          <small style="opacity:0.6">El token debe tener permisos de 'repo'. Se guarda en tu navegador.</small>

          <div style="margin-top:20px">
            <button class="btn" onclick="saveConfig()">Guardar Configuración</button>
          </div>
        </div>
      </section>

    </div>
  </div>
</main>

<!-- FIREBASE (SOLO AUTH) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCFp3Q1lk1gOsWWRu4MPHUj49_eBh9Af38",
    authDomain: "jeighost.firebaseapp.com",
    projectId: "jeighost",
    storageBucket: "jeighost.firebasestorage.app",
    messagingSenderId: "553257365980",
    appId: "1:553257365980:web:823c423bccf0f06f9cdf19"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  // ADMIN EMAIL
  const ADMIN_EMAIL = "prodjeighost@gmail.com";

  // Login Logic
  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    if(email !== ADMIN_EMAIL) {
       alert("No autorizado"); return;
    }

    signInWithEmailAndPassword(auth, email, pass)
      .catch(err => document.getElementById('login-error').textContent = "Error: " + err.message);
  });

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadConfig(); // Cargar config de GH
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }
  });

  window.logout = () => signOut(auth);
</script>

<!-- LOGICA DEL SITIO + GITHUB API -->
<script>
  // UTILIDADES
  function log(msg, type="info") {
    const consoleBox = document.getElementById('console-log');
    consoleBox.classList.remove('hidden');
    const color = type === 'error' ? 'red' : (type === 'success' ? '#0f0' : '#aaa');
    consoleBox.innerHTML += `<div class="log-line" style="color:${color}">> ${msg}</div>`;
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  function slugify(text) {
    return text.toString().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-');
  }

  function generateSlug() {
    const title = document.getElementById('title').value;
    document.getElementById('slug').value = slugify(title);
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  function showSection(id) {
    document.getElementById('editor-section').classList.add('hidden');
    document.getElementById('config-section').classList.add('hidden');
    document.getElementById(id + '-section').classList.remove('hidden');
    
    document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
  }

  // --- GESTIÓN DE CONFIGURACIÓN GITHUB ---
  function saveConfig() {
    const owner = document.getElementById('gh-owner').value;
    const repo = document.getElementById('gh-repo').value;
    const token = document.getElementById('gh-token').value;
    
    if(!owner || !repo || !token) return alert("Faltan datos");
    
    localStorage.setItem('gh_owner', owner);
    localStorage.setItem('gh_repo', repo);
    localStorage.setItem('gh_token', token);
    alert("Configuración guardada en este dispositivo ✅");
  }

  function loadConfig() {
    document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
    document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
    document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
  }

  // --- CODIIFICACIÓN PARA GITHUB (UTF-8 BASE64) ---
  function utf8_to_b64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }
  
  function b64_to_utf8(str) {
    return decodeURIComponent(escape(window.atob(str)));
  }

  // --- LÓGICA DE PUBLICACIÓN ---
  async function publishToGitHub() {
    const owner = localStorage.getItem('gh_owner');
    const repo = localStorage.getItem('gh_repo');
    const token = localStorage.getItem('gh_token');

    if (!owner || !repo || !token) {
      alert("⚠️ Configura primero tu conexión a GitHub en el menú lateral.");
      showSection('config');
      return;
    }

    // Datos del formulario
    const title = document.getElementById('title').value;
    const slug = document.getElementById('slug').value;
    const preview = document.getElementById('preview').value;
    const tags = document.getElementById('tags').value.split(',').map(t=>t.trim());
    const cats = document.getElementById('categories').value.split(',').map(t=>t.trim());
    const content = document.getElementById('content').value;

    if(!title || !content || !slug) return alert("Completa el formulario");

    if(!confirm(`¿Seguro que quieres publicar "${title}" en GitHub?\nEsto creará la carpeta /${slug}/ y subirá los archivos.`)) return;

    // Limpiar consola
    document.getElementById('console-log').innerHTML = '';
    log("Iniciando proceso de publicación...", "info");

    try {
      // 1. OBTENER ID ACTUAL (Leyendo el JSON actual)
      log("Leyendo nuevas-reflexiones.json...", "info");
      const jsonPath = "nuevas-reflexiones.json";
      const jsonUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${jsonPath}`;
      
      let currentJson = [];
      let jsonSha = null;
      let nextId = 18; // Base inicial si no existe archivo

      try {
        const res = await fetch(jsonUrl, { headers: { Authorization: `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          jsonSha = data.sha;
          const contentDecoded = b64_to_utf8(data.content);
          currentJson = JSON.parse(contentDecoded);
          nextId = 17 + currentJson.length + 1; // Calculando ID
        }
      } catch (e) {
        log("No se encontró JSON previo, se creará uno nuevo.", "info");
      }

      log(`ID asignado: ${nextId}`, "success");

      // 2. GENERAR HTML
      const htmlContent = generateFullHTML(title, slug, preview, content, nextId);
      const htmlPath = `${slug}/index.html`; // CARPETA/index.html

      // 3. SUBIR HTML
      log(`Subiendo archivo HTML a: ${htmlPath}...`, "info");
      const uploadRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${htmlPath}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Publicando reflexión: ${title}`,
          content: utf8_to_b64(htmlContent)
        })
      });

      if (!uploadRes.ok) throw new Error("Error subiendo HTML: " + uploadRes.statusText);
      log("HTML subido correctamente ✅", "success");

      // 4. ACTUALIZAR JSON
      log("Actualizando índice JSON...", "info");
      
      const newEntry = {
        id: nextId,
        title: title,
        slug: slug,
        preview: preview,
        tags: tags,
        categories: cats
      };

      currentJson.push(newEntry);

      const updateJsonRes = await fetch(jsonUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Actualizando índice para ${title}`,
          content: utf8_to_b64(JSON.stringify(currentJson, null, 2)),
          sha: jsonSha // Necesario para actualizar archivo existente
        })
      });

      if (!updateJsonRes.ok) throw new Error("Error actualizando JSON");
      
      log("JSON actualizado correctamente ✅", "success");
      log("🎉 ¡PUBLICACIÓN COMPLETADA! Tu página se actualizará en unos minutos.", "success");
      
      alert("¡Publicado con éxito!");
      clearForm();

    } catch (error) {
      log("❌ ERROR FATAL: " + error.message, "error");
      console.error(error);
      alert("Ocurrió un error. Revisa la consola negra abajo.");
    }
  }

  // --- GENERADOR DE PLANTILLA HTML ---
  function generateFullHTML(title, slug, preview, contentRaw, id) {
    // Convertir saltos de línea a <p>
    const paragraphs = contentRaw.split('\n').filter(line => line.trim() !== '')
      .map(line => `<p>${line.trim()}</p>`).join('\n');

    // Plantilla idéntica a tus otras reflexiones
    return `<!DOCTYPE html>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:wght@300;400&display=swap" media="all">

  <div class="fuego-fondo"></div>

  <script src="../advanced-features.js"></ script>

  }

  function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('slug').value = '';
    document.getElementById('preview').value = '';
    document.getElementById('tags').value = '';
    document.getElementById('content').value = '';
  }
</script>
