<aside class="avisos wrap" data-avisos-bloque hidden>
  <div class="avisos-inner">
    <span class="avisos-icon" aria-hidden="true">{% include icon.html name="bell" %}</span>
    <div class="avisos-text">
      <p class="avisos-title">¿Quieres saber cuándo hay una reflexión nueva?</p>
      <p>Activa los avisos y te llegará una notificación cuando publique. Sin correos, sin spam.</p>
    </div>
    <button class="btn btn-primary" type="button" data-avisos>{% include icon.html name="bell" %}<span data-avisos-texto>Activar avisos</span></button>
  </div>
</aside>
